WebSite: https://datakeeper.pages.dev/kryptos
SourceCode: https://github.com/swisslite/Kryptos
IssueTracker: https://github.com/swisslite/Kryptos/issues

Builds:
  - versionName: 2.1.1
    versionCode: 6
    commit: 8567521ec1242db7c6c58170edb56361e5f6bb73
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y rustup cmake build-essential clang libclang-dev
      - apt-get install -y protobuf-compiler libprotobuf-dev
    gradle:
      - yes
    prebuild:
      - cd ../..
      - ./scripts/setup-libsignal.sh
      - cd ThirdParty/libsignal
      - rustup target add aarch64-linux-android armv7-linux-androideabi
    scandelete:
      - ThirdParty/ObjectivePGP
      - ThirdParty/libsignal/rust/attest/fuzz/seeds
    build:
      - export PROTOC=/usr/bin/protoc
      - cd ../../ThirdParty/libsignal
      - export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
      - export CFLAGS="-ffile-prefix-map=$PWD=."
      - export CXXFLAGS="-ffile-prefix-map=$PWD=."
      - export RUSTFLAGS="-C link-arg=-Wl,--build-id=none"
      - ./java/build_jni.sh android-arm64 android-arm
    ndk: 26.1.10909125

